ClusterName=hpccluster
SlurmctldHost=node1
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CryptoType=crypto/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# Process Tracking & Resource Isolation
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ReturnToService=2

# Compute Nodes (Matched to your lscpu and free -m output)
NodeName=node[2-3] CPUs=4 Sockets=2 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=5000 State=UNKNOWN

# Partitions
PartitionName=compute Nodes=node[2-3] Default=YES MaxTime=INFINITE State=UP
